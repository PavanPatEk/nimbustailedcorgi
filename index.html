<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbus the Corgi | Official Website</title>
  <!-- Link to your external stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dynamic FX Background Layer -->
  <div id="fx-layer"></div>

  <!-- Page Content -->
  <div class="container">
    <header>
      <h1>Nimbus 🐾</h1>
      <p class="subtitle">The adventurous Corgi with the magnificent tail!</p>
      <div id="time-display" class="time-badge">Loading local time...</div>
    </header>

    <main class="gallery-section">
      <h2>Nimbus's Photo Gallery</h2>
      <div class="gallery-grid">
        <div class="gallery-card">
          <img src="https://via.placeholder.com/300x300?text=Nimbus+1" alt="Nimbus 1">
          <p>Sunny Walkies</p>
        </div>
        <div class="gallery-card">
          <img src="https://via.placeholder.com/300x300?text=Nimbus+2" alt="Nimbus 2">
          <p>Treat Time!</p>
        </div>
        <div class="gallery-card">
          <img src="https://via.placeholder.com/300x300?text=Nimbus+3" alt="Nimbus 3">
          <p>Cozy Nap</p>
        </div>
        <div class="gallery-card">
          <img src="https://via.placeholder.com/300x300?text=Nimbus+4" alt="Nimbus 4">
          <p>Tail Wagging Action</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Link to your external JavaScript -->
  <script src="script.js"></script>
</body>
</html>

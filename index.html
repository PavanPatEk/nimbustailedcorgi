<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbus the Corgi | Official Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dynamic FX Background Layer -->
  <div id="fx-layer"></div>

  <!-- Page Content -->
  <div class="container">
    <header>
      <h1>Nimbus 🐾</h1>
      <p class="subtitle">The adventurous Corgi with the magnificent tail!</p>
      <div id="time-display" class="time-badge">Loading local time...</div>
    </header>

    <main class="gallery-section">
      <h2>Nimbus's Photo Gallery</h2>
      <div class="gallery-grid">
        <div class="gallery-card">
          <img src="nimbus photo 1.jpg" alt="Nimbus 1">
        </div>
        <div class="gallery-card">
          <img src="nimbus photo 2.jpg" alt="Nimbus 2">
        </div>
        <div class="gallery-card">
          <img src="nimbus photo 3.jpg" alt="Nimbus 3">
        </div>
        <div class="gallery-card">
          <img src="nimbus photo 4.jpg" alt="Nimbus 4">
        </div>
        <div class="gallery-card">
          <img src="nimbus photo 5.jpg" alt="Nimbus 5">
        </div>
        <div class="gallery-card">
          <img src="nimbus photo 6.jpg" alt="Nimbus 6">
        </div>
        <div class="gallery-card">
          <img src="nimbus photo 7.jpg" alt="Nimbus 7">
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>

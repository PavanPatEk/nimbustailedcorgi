<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbus the Corgi | Official Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dynamic FX Background Layer -->
  <div id="fx-layer"></div>

  <!-- Main Container -->
  <div class="container">
    <header>
      <h1>Nimbus 🐾</h1>
      <p class="subtitle">The adventurous Corgi with the magnificent tail!</p>
      <div id="time-display" class="time-badge">Loading local time...</div>
    </header>

    <main class="gallery-section">
      <h2>Nimbus's Photo Gallery</h2>
      <div class="gallery-grid">
        <div class="gallery-card"><img src="nimbus photo 1.jpg" alt="Nimbus Photo 1"></div>
        <div class="gallery-card"><img src="nimbus photo 2.jpg" alt="Nimbus Photo 2"></div>
        <div class="gallery-card"><img src="nimbus photo 3.jpg" alt="Nimbus Photo 3"></div>
        <div class="gallery-card"><img src="nimbus photo 4.jpg" alt="Nimbus Photo 4"></div>
        <div class="gallery-card"><img src="nimbus photo 5.jpg" alt="Nimbus Photo 5"></div>
        <div class="gallery-card"><img src="nimbus photo 6.jpg" alt="Nimbus Photo 6"></div>
        <div class="gallery-card"><img src="nimbus photo 7.jpg" alt="Nimbus Photo 7"></div>
      </div>
    </main>
  </div>

  <!-- Zoom Lightbox Modal -->
  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <div class="lightbox-nav prev">&#10094;</div>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="Zoomed Nimbus Photo">
    </div>
    <div class="lightbox-nav next">&#10095;</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
